name: 🐛 Bug report
description: Report a defect in an Oroya Animate package
labels: [bug, triage]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for filing a bug! Please run the latest release first
              (`pnpm update`) — many bugs are already fixed on `main`.
    - type: input
      id: version
      attributes:
          label: Package and version
          description: Which package(s) and version(s) are affected?
          placeholder: '@joroya/core@1.0.0, @joroya/renderer-three@1.0.0'
      validations:
          required: true
    - type: input
      id: env
      attributes:
          label: Runtime
          description: Browser / Node version, OS
          placeholder: 'Chrome 124, Windows 11'
      validations:
          required: true
    - type: textarea
      id: repro
      attributes:
          label: Minimal reproduction
          description: |
              A repo, gist, or CodeSandbox that reproduces the bug. The
              smaller, the faster we can fix it.
          placeholder: 'https://codesandbox.io/...'
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          placeholder: 'After calling animator.play("walk"), the cube should...'
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          placeholder: 'Nothing happens, no console output...'
      validations:
          required: true
    - type: textarea
      id: extras
      attributes:
          label: Additional context
          description: Stack traces, screenshots, anything else relevant.
