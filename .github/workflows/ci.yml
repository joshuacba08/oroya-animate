name: CI - Test & Build
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
permissions:
  contents: read
jobs:
  libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:packages
      - run: pnpm typecheck:packages
      - run: pnpm api:check:strict
      - run: pnpm test
      - run: pnpm build
  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:apps
      - run: pnpm docs:check
      - run: pnpm docs:validate
      - run: pnpm typecheck:apps
      - run: pnpm build:apps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
