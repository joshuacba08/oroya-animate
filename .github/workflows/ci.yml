name: CI - Test & Build
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
permissions:
  contents: read
jobs:
  libraries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:packages
      - run: pnpm architecture:check
      - run: pnpm typecheck:packages
      - run: pnpm api:check:strict
      - run: pnpm api:compat
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:packages
  react18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @joroya/react add -D react@18.3.1 react-dom@18.3.1 @types/react@18.3.0 @types/react-dom@18.3.7
      - run: pnpm test -- packages/react/tests
  applications:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:apps
      - run: pnpm docs:check
      - run: pnpm docs:validate
      - run: pnpm typecheck:apps
      - run: pnpm build:apps
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Linux software GL drivers
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 mesa-utils
      - name: Browser acceptance with virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a pnpm test:browser
      - name: Browser acceptance on Windows
        if: runner.os == 'Windows'
        run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
