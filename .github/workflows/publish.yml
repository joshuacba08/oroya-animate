name: Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm test
      
      - name: Build packages
        run: pnpm build
      
      - name: Publish to NPM
        run: pnpm --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes in v${{ steps.version.outputs.VERSION }}
            
            ### Packages Published
            - `@joroya/core@${{ steps.version.outputs.VERSION }}`
            - `@joroya/renderer-three@${{ steps.version.outputs.VERSION }}`
            - `@joroya/renderer-svg@${{ steps.version.outputs.VERSION }}`
            - `@joroya/loader-gltf@${{ steps.version.outputs.VERSION }}`
            
            ### Installation
            ```bash
            npm install @joroya/core @joroya/renderer-three
            ```
            
            ### CDN
            ```html
            <script type="module">
              import { Scene } from 'https://unpkg.com/@joroya/core@${{ steps.version.outputs.VERSION }}/dist/index.js';
            </script>
            ```
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
