name: Publish to NPM
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, for example 1.2.0-rc.0'
        required: true
        type: string
      channel:
        description: 'Candidate or stable channel'
        required: true
        type: choice
        options: [next, latest]
      validated_run:
        description: 'Optional accepted run to retry without changing SDK inputs'
        required: false
        type: string
      accept_pending_devices:
        description: 'Explicit maintainer exception: publish latest with physical device acceptance pending'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !inputs.validated_run }}
    uses: ./.github/workflows/ci.yml
  publish:
    if: ${{ !inputs.validated_run }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Verify configured npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"
      - run: pnpm install --frozen-lockfile
      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF#refs/tags/v}}"
          CHANNEL="${REQUESTED_CHANNEL:-latest}"
          if [[ "$VERSION" == *-* ]]; then CHANNEL=next; fi
          node scripts/sync-versions.js "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - run: pnpm install --lockfile-only
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm architecture:check
      - run: pnpm api:check:strict
      - run: pnpm api:compat
      - run: pnpm test
      - run: pnpm verify:packages
      - name: Block invalid manifests and declaration entry points
        run: |
          for package in packages/*/; do
            pnpm dlx publint@0.3.18 "$package"
            pnpm dlx @arethetypeswrong/cli@0.18.3 --pack "$package"
          done
      - run: pnpm build:apps
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install software GL drivers
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 mesa-utils
      - name: Browser acceptance with virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a pnpm test:browser
      - name: Performance regression gate
        run: pnpm release:check --performance-only
      - name: Verify or refresh endurance evidence
        run: |
          if pnpm release:check --candidate; then
            echo "Reusing accepted endurance evidence for the identical built SDK."
          else
            pnpm test:endurance
          fi
      - name: Candidate acceptance
        if: steps.release.outputs.channel == 'next'
        run: pnpm release:check --candidate
      - name: Stable acceptance including physical devices
        if: steps.release.outputs.channel == 'latest'
        env:
          ACCEPT_PENDING_DEVICES: ${{ inputs.accept_pending_devices }}
        run: |
          args=()
          if [[ "$ACCEPT_PENDING_DEVICES" == true ]]; then
            args+=(--accept-pending-devices)
            echo 'Maintainer requested direct stable publication. Physical Safari/iOS and Chrome/Android acceptance remains pending; all other checks are required.' >> "$GITHUB_STEP_SUMMARY"
          fi
          pnpm release:check "${args[@]}"
      - name: Publish and verify every compatible package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          ACCEPT_PENDING_DEVICES: ${{ inputs.accept_pending_devices }}
        run: |
          args=()
          if [[ "$RELEASE_CHANNEL" == latest && "$ACCEPT_PENDING_DEVICES" == true ]]; then
            args+=(--accept-pending-devices)
          fi
          pnpm publish:release "$RELEASE_CHANNEL" "${args[@]}"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.channel == 'next' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: validation/
  retry:
    if: ${{ inputs.validated_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged SDK and accepted release validation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
          RETRY_CHANNEL: ${{ inputs.channel }}
        run: |
          test "$RETRY_CHANNEL" = next || test "$RETRY_CHANNEL" = latest
          node scripts/check-release-retry.js "$VALIDATED_RUN"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Verify configured token identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
      - name: Restore accepted release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: |
          gh run download "$VALIDATED_RUN" --name release-evidence --dir .cache/accepted-evidence
          cp -a .cache/accepted-evidence/. validation/
      - name: Resolve version from the accepted candidate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const accepted=JSON.parse(readFileSync("validation/package-consumers.json", "utf8")).packages[0].version; const expected=process.env.REQUESTED_CHANNEL === "latest" ? accepted.split("-")[0] : accepted; if (process.env.REQUESTED_VERSION !== expected) throw new Error("Requested version does not match accepted candidate");'
          node scripts/sync-versions.js "$REQUESTED_VERSION"
          pnpm install --lockfile-only
      - run: pnpm build
      - run: pnpm test scripts/tests/registry-version.test.ts
      - run: pnpm verify:packages
      - run: pnpm release:check --candidate
      - name: Finish publication and verify requested tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          ACCEPT_PENDING_DEVICES: ${{ inputs.accept_pending_devices }}
        run: |
          args=()
          if [[ "$ACCEPT_PENDING_DEVICES" == true ]]; then
            args+=(--accept-pending-devices)
            echo 'Maintainer explicitly requested latest before physical Safari/iOS and Chrome/Android acceptance. These checks remain pending, not passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          pnpm publish:release "$REQUESTED_CHANNEL" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-retry-evidence
          path: validation/
