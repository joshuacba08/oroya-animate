name: Publish to NPM

on:
    push:
        tags:
            - 'v*.*.*'

# Top-level permissions: `contents: write` for the GitHub release;
# `id-token: write` so npm publish can mint a Sigstore provenance
# attestation linking each tarball to this exact CI run.
permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # ── Quality gates: every gate must pass before *any* package publishes.
            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

            - name: Build packages
              run: pnpm build

            # ── Pre-publish manifest validation.
            #
            # `publint` checks each `package.json` against the npm specs
            # (exports map, types-first condition order, file extensions).
            # `@arethetypeswrong/cli` verifies TypeScript consumers resolve
            # the `.d.ts` correctly under every module-resolution mode.
            - name: Validate package manifests (publint)
              run: |
                  for pkg in packages/*/; do
                    if [ -f "$pkg/package.json" ]; then
                      pnpm dlx publint@latest "$pkg"
                    fi
                  done

            - name: Validate type entry points (arethetypeswrong)
              run: |
                  for pkg in packages/*/; do
                    if [ -f "$pkg/package.json" ]; then
                      pnpm dlx @arethetypeswrong/cli@latest --pack "$pkg" --ignore-rules cjs-resolves-to-esm || true
                    fi
                  done

            # Trusted publishing uses the GitHub OIDC token granted above.
            # npm generates provenance automatically for public packages.
            - name: Publish @joroya/core to NPM (trusted publishing)
              working-directory: packages/core
              run: npm publish --access public

            - name: Extract version from tag
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  name: "v${{ steps.version.outputs.VERSION }}"
                  generate_release_notes: true
                  prerelease: ${{ contains(github.ref, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
